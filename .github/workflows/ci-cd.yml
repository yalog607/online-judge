name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_DB_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: "1433"
      DB_NAME: itoj
      DB_SA_PASSWORD: ${{ secrets.CI_DB_SA_PASSWORD }}
      DB_APP_USER: itoj_app
      DB_APP_PASSWORD: ${{ secrets.CI_DB_APP_PASSWORD }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
      SMTP_HOST: localhost
      REDIS_URL: redis://localhost:6379
      SMTP_PORT: "1025"
      MAIL_FROM: "ITOJ <no-reply@yalina.io.vn>"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run db:test
      - run: npm test
      - run: npm run build

  images:
    # Build image trên runner (có cache layer) rồi push lên GHCR để VPS chỉ cần pull.
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/itoj-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/itoj-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    # CD chỉ chạy sau khi image đã push và chỉ khi có code mới vào main (không chạy trên PR).
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy on VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ needs.images.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Token đi qua stdin để không lộ trong danh sách tiến trình trên VPS.
          echo "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}             "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}             "cd ~/online-judge && git fetch origin && git reset --hard origin/main && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' bash deploy/deploy.sh"
