name: deploy

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web-tag: ${{ steps.tags.outputs.web }}
      worker-tag: ${{ steps.tags.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: |
          echo "web=ghcr.io/${{ github.repository }}-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${{ github.repository }}-worker:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.worker }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Sync compose files
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/itoj/
      - name: Deploy on VPS
        env:
          WEB_IMAGE: ${{ needs.build-push.outputs.web-tag }}
          WORKER_IMAGE: ${{ needs.build-push.outputs.worker-tag }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/itoj && WEB_IMAGE=$WEB_IMAGE WORKER_IMAGE=$WORKER_IMAGE bash deploy.sh"
